<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CancerFax FAQ Review</title>
<style>
  /* ===== Design tokens — light is the base, dark + explicit toggles override ===== */
  :root{
    --bg:#e9edf3; --surface:#ffffff; --surface2:#f1f4f9; --border:#d7dde7;
    --text:#182231; --muted:#5a6474; --faint:#8b95a4;
    --accent:#2f6fb0; --accent-bg:#e3eef9; --accent-border:#b6d2ec;
    --green:#1c854b; --green-bg:#e0f2e6; --green-border:#a7dabb;
    --amber:#8a5d00; --amber-line:#c79318; --amber-bg:#fbefcf; --amber-border:#e7cf8e;
    --red:#b1332d; --red-bg:#fbe3e1; --red-border:#eeb2ad;
    --pending-bar:#c4ccd8;
    --shadow:0 1px 2px rgba(24,34,49,.06),0 8px 24px rgba(24,34,49,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#121316; --surface:#1a1b1f; --surface2:#212228; --border:#2f3138;
      --text:#e7e8ec; --muted:#9aa0ad; --faint:#6c7280;
      --accent:#7db8f0; --accent-bg:#16324f; --accent-border:#2c5a86;
      --green:#5fd08a; --green-bg:#173d24; --green-border:#2f6b41;
      --amber:#e6b64a; --amber-line:#e6b64a; --amber-bg:#3d2f10; --amber-border:#5a4718;
      --red:#e88a8a; --red-bg:#42201f; --red-border:#6b2f2c;
      --pending-bar:#3a3b42;
      --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.35);
    }
  }
  /* Explicit toggle wins over the media query in both directions */
  :root[data-theme="light"]{
    --bg:#e9edf3; --surface:#ffffff; --surface2:#f1f4f9; --border:#d7dde7;
    --text:#182231; --muted:#5a6474; --faint:#8b95a4;
    --accent:#2f6fb0; --accent-bg:#e3eef9; --accent-border:#b6d2ec;
    --green:#1c854b; --green-bg:#e0f2e6; --green-border:#a7dabb;
    --amber:#8a5d00; --amber-line:#c79318; --amber-bg:#fbefcf; --amber-border:#e7cf8e;
    --red:#b1332d; --red-bg:#fbe3e1; --red-border:#eeb2ad;
    --pending-bar:#c4ccd8;
    --shadow:0 1px 2px rgba(24,34,49,.06),0 8px 24px rgba(24,34,49,.06);
  }
  :root[data-theme="dark"]{
    --bg:#121316; --surface:#1a1b1f; --surface2:#212228; --border:#2f3138;
    --text:#e7e8ec; --muted:#9aa0ad; --faint:#6c7280;
    --accent:#7db8f0; --accent-bg:#16324f; --accent-border:#2c5a86;
    --green:#5fd08a; --green-bg:#173d24; --green-border:#2f6b41;
    --amber:#e6b64a; --amber-line:#e6b64a; --amber-bg:#3d2f10; --amber-border:#5a4718;
    --red:#e88a8a; --red-bg:#42201f; --red-border:#6b2f2c;
    --pending-bar:#3a3b42;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button,input,textarea{font-family:inherit}
  ::selection{background:var(--accent-bg)}

  /* ===== Header ===== */
  header{display:flex;align-items:center;gap:18px;padding:12px 20px;background:var(--surface);
    border-bottom:1px solid var(--border);position:sticky;top:0;z-index:6}
  .brand{font-weight:700;font-size:15px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
  .brand .mark{color:var(--accent);font-size:16px}
  .brand small{color:var(--faint);font-weight:500;font-size:11.5px;font-variant-numeric:tabular-nums}
  .progress{flex:1;max-width:440px;min-width:180px}
  .pbar{height:8px;border-radius:6px;background:var(--surface2);overflow:hidden;display:flex;
    border:1px solid var(--border)}
  .pbar i{display:block;height:100%;transition:width .35s ease}
  .pstats{display:flex;flex-wrap:wrap;gap:14px;margin-top:6px;font-size:11px;color:var(--muted);
    font-variant-numeric:tabular-nums}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .hdr-actions{display:flex;align-items:center;gap:8px;margin-left:auto}

  .btn{padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);
    color:var(--text);font-size:12px;font-weight:500;cursor:pointer;transition:background .12s,border-color .12s,transform .05s;
    white-space:nowrap}
  .btn:hover{background:var(--border)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent-bg);color:var(--accent);border-color:var(--accent-border)}
  .btn.primary:hover{filter:brightness(1.04)}
  .btn.ghost{background:transparent;color:var(--muted);border-style:dashed}
  .btn.ghost:hover{color:var(--text);border-color:var(--accent-border)}
  .btn.icon{padding:7px 9px;color:var(--muted)}
  .btn:focus-visible,.pill:focus-visible,input:focus-visible,textarea:focus-visible,.li:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px}

  /* ===== Layout ===== */
  .layout{display:flex;height:calc(100vh - 93px);min-height:0}
  aside{flex:0 0 340px;border-right:1px solid var(--border);display:flex;flex-direction:column;
    background:var(--surface);min-height:0}
  .search{margin:14px 14px 10px;padding:9px 12px;border-radius:9px;border:1px solid var(--border);
    background:var(--bg);color:var(--text);font-size:12.5px}
  .search::placeholder{color:var(--faint)}
  .filters{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px;border-bottom:1px solid var(--border)}
  .pill{padding:4px 11px;border:1px solid var(--border);border-radius:20px;font-size:11px;color:var(--muted);
    cursor:pointer;background:transparent;font-variant-numeric:tabular-nums;transition:background .12s,color .12s}
  .pill:hover{color:var(--text)}
  .pill.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent-border);font-weight:600}
  .pill .n{opacity:.7;margin-left:2px}

  .list{overflow-y:auto;flex:1;min-height:0}
  .li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 15px;
    border-bottom:1px solid var(--border);cursor:pointer;border-left:3px solid transparent}
  .li:hover{background:var(--surface2)}
  .li.active{background:var(--accent-bg);border-left-color:var(--accent)}
  .li .t{font-size:12.5px;font-weight:600;line-height:1.35;color:var(--text)}
  .li .sub{font-size:10.5px;color:var(--faint);margin-top:3px;font-variant-numeric:tabular-nums}
  .li .dup{color:var(--amber-line);font-weight:600}

  .chip{padding:3px 10px;border-radius:20px;font-size:10.5px;font-weight:600;white-space:nowrap;
    border:1px solid transparent;font-variant-numeric:tabular-nums}
  .c-pend{background:var(--surface2);color:var(--muted);border-color:var(--border)}
  .c-ok{background:var(--green-bg);color:var(--green);border-color:var(--green-border)}
  .c-work{background:var(--red-bg);color:var(--red);border-color:var(--red-border)}
  .c-verify{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-border)}

  .sidebar-empty{padding:26px 18px;color:var(--faint);font-size:12px;text-align:center;line-height:1.6}

  /* ===== Main / detail ===== */
  main{flex:1;overflow-y:auto;padding:26px 34px 40px;min-width:0}
  .detail-wrap{max-width:820px;margin:0 auto}
  .phead{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:4px}
  .ptitle{font-size:21px;font-weight:700;line-height:1.25;margin:0;letter-spacing:-.015em;text-wrap:balance}
  .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:10px 0 0;font-size:11.5px;color:var(--muted)}
  .meta .sep{color:var(--faint)}
  .meta b{color:var(--text);font-weight:600}
  .verify-row{margin-top:12px;gap:8px}
  .verify{background:var(--amber-bg);color:var(--amber);padding:5px 11px;border-radius:7px;font-size:11.5px;
    border:1px solid var(--amber-border);font-weight:600;display:inline-flex;align-items:center;gap:6px}
  .verify.resolved{background:var(--green-bg);color:var(--green);border-color:var(--green-border)}
  .verify.ok{background:var(--surface2);color:var(--muted);border-color:var(--border);font-weight:500}
  .verify code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px}
  .vedit{display:flex;flex-direction:column;gap:4px;font-size:10.5px;color:var(--amber-line);
    text-transform:uppercase;letter-spacing:.5px;font-weight:600;flex:1;min-width:240px}
  .vinput{padding:7px 10px;border-radius:7px;border:1px solid var(--amber-border);background:var(--bg);
    color:var(--text);font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

  .statussel{display:flex;gap:7px;flex-shrink:0}
  .btn.st-ok.on{background:var(--green-bg);color:var(--green);border-color:var(--green-border)}
  .btn.st-work.on{background:var(--red-bg);color:var(--red);border-color:var(--red-border)}

  .groups{margin-top:8px}
  .grp{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--accent);font-weight:700;
    margin:26px 0 6px;padding-bottom:6px;border-bottom:1px solid var(--border)}
  .qa{padding:12px 0;border-bottom:1px solid var(--border)}
  .qa:last-child{border-bottom:none}
  .q{font-weight:650;font-size:13.5px;color:var(--text);line-height:1.4}
  .a{color:var(--muted);font-family:var(--serif);font-size:15px;line-height:1.62;margin-top:6px}
  .a p{margin:0 0 .6em}
  .a p:last-child{margin-bottom:0}
  .a-edit{width:100%;margin-top:6px;min-height:92px;padding:10px 12px;border-radius:8px;
    border:1px solid var(--accent-border);background:var(--bg);color:var(--text);font-family:var(--serif);
    font-size:14px;line-height:1.55;resize:vertical}

  .disclaimer{margin-top:24px;padding:12px 14px;border-radius:9px;background:var(--surface2);
    border:1px solid var(--border);color:var(--faint);font-size:11px;line-height:1.55}
  .disclaimer b{color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-size:10px}

  .actions{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 34%);
    padding:20px 0 6px;margin-top:20px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .notes{flex:1;min-width:200px;padding:9px 12px;border-radius:8px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);font-size:12.5px}
  .notes::placeholder{color:var(--faint)}

  /* ===== Empty / placeholder ===== */
  .placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;height:100%;color:var(--muted);gap:12px;padding:40px}
  .placeholder .big{font-size:17px;font-weight:600;color:var(--text)}
  .placeholder .glyph{font-size:34px;opacity:.5}
  .placeholder code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    background:var(--surface2);padding:2px 7px;border-radius:5px;border:1px solid var(--border);font-size:12px}

  /* ===== Toast + banner + drop overlay ===== */
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--surface);
    color:var(--text);border:1px solid var(--border);border-radius:10px;padding:11px 16px;font-size:12.5px;
    box-shadow:var(--shadow);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
    max-width:min(520px,90vw)}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast .warn{color:var(--amber-line);font-weight:600}
  .lsbanner{background:var(--amber-bg);color:var(--amber);text-align:center;padding:8px 14px;font-size:12px;
    border-bottom:1px solid var(--amber-border)}
  .lsbanner[hidden]{display:none}

  .dropzone{position:fixed;inset:0;z-index:30;background:color-mix(in srgb,var(--accent-bg) 88%,transparent);
    display:none;align-items:center;justify-content:center;pointer-events:none}
  body.dragging .dropzone{display:flex}
  .dropzone .card{border:2px dashed var(--accent);border-radius:16px;padding:44px 60px;background:var(--surface);
    color:var(--accent);font-size:16px;font-weight:600;box-shadow:var(--shadow)}

  @media (max-width:780px){
    .layout{flex-direction:column;height:auto}
    aside{flex:none;width:100%;border-right:none;border-bottom:1px solid var(--border);max-height:44vh}
    main{padding:20px}
    .progress{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div id="app">
  <div class="lsbanner" id="lsBanner" hidden>Storage is unavailable or full — your decisions won't persist after this tab closes. You can still export them.</div>
  <header>
    <div class="brand"><span class="mark">✚</span>CancerFax FAQ Review <small id="srcLabel">output/faq · 0 pages loaded</small></div>
    <div class="progress" id="progress" aria-label="Review progress"></div>
    <div class="hdr-actions">
      <button class="btn icon" id="themeBtn" title="Toggle light / dark" aria-label="Toggle theme">◐</button>
      <button class="btn ghost" id="dropBtn">⤓ Drop JSON files</button>
      <button class="btn primary" id="exportBtn">⇪ Export decisions</button>
    </div>
  </header>

  <div class="layout">
    <aside>
      <input class="search" id="search" placeholder="Search pages…" autocomplete="off" aria-label="Search pages">
      <div class="filters" id="filters"></div>
      <div class="list" id="list"></div>
    </aside>
    <main id="detail"></main>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="dropzone" id="dropzone"><div class="card">Drop FAQ JSON files to load</div></div>
<input type="file" id="fileInput" accept=".json,application/json" multiple hidden>

<script>
/* ===== CONTRACTS ===== */
// A "page" is one fixture wrapper as written by faq_write.py:
//   { pillar, contentType, runner, slug, route, section|sectionToMerge:{type,id,h2,intro,groups[]},
//     schemaRecommendation, medicalDisclaimer }
const VERIFY_RE = /^\s*⚠\s*VERIFY:\s*/;

function cleanSlug(raw) {            // strip "⚠ VERIFY:" prefix; return {value, needsVerify}
  const s = String(raw ?? "");
  return { value: s.replace(VERIFY_RE, "").trim(), needsVerify: VERIFY_RE.test(s) };
}
function getSection(page) {           // returns the faq section regardless of key
  return page.section || page.sectionToMerge || null;
}
function sectionKey(page) {           // which key held it (preserved on output)
  return page.sectionToMerge ? "sectionToMerge" : "section";
}
function faqCount(page) {
  const s = getSection(page); if (!s) return 0;
  return (s.groups || []).reduce((n, g) => n + (g.items || []).length, 0);
}
function isFaqShape(page) {
  const s = getSection(page);
  return !!(s && s.type === "faq" && Array.isArray(s.groups));
}
function pageVerifyFlags(page) {      // count of ⚠ VERIFY fields (slug + route)
  return [page.slug, page.route].filter(v => VERIFY_RE.test(String(v ?? ""))).length;
}
function ensureP(html) {              // guarantee an answer stays <p>-wrapped for output
  const t = String(html ?? "").trim();
  return /^<p>[\s\S]*<\/p>$/.test(t) ? t : `<p>${t.replace(/^<p>|<\/p>$/g, "")}</p>`;
}
window.__contracts = { cleanSlug, getSection, sectionKey, faqCount, isFaqShape, pageVerifyFlags, ensureP };

// small HTML escaper for reviewer-facing text (questions/titles/notes) — answers stay raw HTML
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ===== STATE ===== */
const LS_KEY = "cancerfax-faq-review:v1";
let REVIEW = {};                       // { "<slug>": { status, note, edits:{answers:{}, slug, route} } }
function loadReview() {
  try { REVIEW = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); }
  catch { REVIEW = {}; }
}
function saveReview() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(REVIEW)); return true; }
  catch { return false; }             // quota/unavailable -> caller warns, keeps in-memory REVIEW
}
function reviewFor(slug) {             // default record for an untouched page
  return REVIEW[slug] || (REVIEW[slug] = { status: "pending", note: "", edits: { answers: {}, slug: "", route: "" } });
}
let lsWarned = false;
function persist(){                    // save; warn once (non-blocking) if storage fails
  if (!saveReview() && !lsWarned) { lsWarned = true; document.getElementById("lsBanner").hidden = false; }
}

/* ===== DATA ===== */
const BAKED = [
  {
    "pillar": "What is the difference between leukemia, lymphoma, and myeloma?",
    "contentType": "⚠ VERIFY",
    "runner": "⚠ VERIFY: unknown (Content Type not set in sheet)",
    "slug": "⚠ VERIFY: what-is-the-difference-between-leukemia-lymphoma-and-myeloma",
    "route": "⚠ VERIFY: /<section>/what-is-the-difference-between-leukemia-lymphoma-and-myeloma",
    "section": {
      "type": "faq",
      "id": "faq",
      "h2": "Frequently Asked Questions About the Difference Between Leukemia, Lymphoma, and Myeloma",
      "intro": "Common questions from patients and families trying to understand how leukemia, lymphoma, and myeloma differ, and how each of these blood cancers is diagnosed and treated.",
      "groups": [
        {
          "title": "Understanding the Difference",
          "items": [
            { "q": "What is the difference between leukemia, lymphoma, and myeloma?", "a": "<p>Leukemia, lymphoma, and myeloma are three distinct blood cancers that differ mainly by which cell they start in and where they grow. Leukemia begins in blood-forming cells of the bone marrow and releases abnormal white blood cells into the bloodstream. Lymphoma starts in lymphocytes within the lymph nodes and lymphatic system. Myeloma arises from plasma cells in the bone marrow. Correct classification guides treatment and depends on specialist review.</p>" },
            { "q": "Where does each of these blood cancers start in the body?", "a": "<p>Each of these blood cancers begins in a different location. Leukemia develops in the bone marrow, the spongy tissue inside bones where blood cells are made, and typically enters the bloodstream. Lymphoma usually starts in the lymph nodes and lymphatic tissue, though it can spread to the marrow and organs. Myeloma grows within the bone marrow itself, where abnormal plasma cells accumulate. Confirming the exact origin requires specialist testing and pathology review.</p>" },
            { "q": "Are leukemia, lymphoma, and myeloma all types of blood cancer?", "a": "<p>Yes, leukemia, lymphoma, and myeloma are all classified as blood cancers, also called hematological cancers. They develop from cells of the blood, bone marrow, or lymphatic system, which is why they are grouped together. Despite this shared category, they behave differently, affect different cell types, and are managed by hematologists or hemato-oncologists. Understanding that they are related but distinct helps patients and families follow their specific diagnosis and care plan.</p>" },
            { "q": "What do leukemia, lymphoma, and myeloma have in common?", "a": "<p>Leukemia, lymphoma, and myeloma all arise from cells of the blood and immune system, most originating from white blood cells. All three involve the uncontrolled growth of abnormal cells that can crowd out healthy blood cells, weaken immunity, and cause fatigue, infections, or anemia. They are also frequently treated with overlapping approaches such as chemotherapy, targeted therapy, immunotherapy, and stem cell transplant. The specific plan depends on the exact diagnosis and specialist review.</p>" }
          ]
        },
        {
          "title": "Types and Diagnosis",
          "items": [
            { "q": "What are the main types of leukemia?", "a": "<p>Leukemia is mainly divided into four types based on how fast it grows and which cells it affects. Acute lymphoblastic leukemia (ALL) and acute myeloid leukemia (AML) progress quickly, while chronic lymphocytic leukemia (CLL) and chronic myeloid leukemia (CML) develop more slowly. Acute types usually need prompt treatment, while chronic types may be monitored before therapy begins. Less common forms also exist, and the exact subtype is confirmed through blood and bone marrow testing.</p>" },
            { "q": "What are the main types of lymphoma?", "a": "<p>Lymphoma is broadly divided into Hodgkin lymphoma and non-Hodgkin lymphoma, which together include dozens of subtypes. Hodgkin lymphoma is identified by specific abnormal cells called Reed-Sternberg cells and often responds well to treatment. Non-Hodgkin lymphoma is far more common and ranges from slow-growing (indolent) to fast-growing (aggressive) forms, such as diffuse large B-cell lymphoma. The precise subtype, confirmed by lymph node biopsy, strongly influences treatment and requires specialist review.</p>" },
            { "q": "What is multiple myeloma and how is it different from lymphoma?", "a": "<p>Multiple myeloma is a cancer of plasma cells, the antibody-producing white blood cells found in the bone marrow. Unlike lymphoma, which usually forms tumors in lymph nodes, myeloma builds up inside the marrow and can weaken bones, causing bone pain, anemia, kidney problems, and high calcium levels. Both are blood cancers, but they start from different cell stages and are diagnosed and treated differently. Confirmation requires bone marrow testing and specialist review.</p>" },
            { "q": "How are leukemia, lymphoma, and myeloma diagnosed?", "a": "<p>Leukemia, lymphoma, and myeloma are diagnosed using different combinations of tests based on where each cancer grows. Leukemia is usually found through blood counts and a bone marrow biopsy. Lymphoma is typically confirmed by removing and examining a lymph node, often with PET or CT imaging for staging. Myeloma is diagnosed through bone marrow biopsy, blood and urine protein tests, and bone imaging. Final diagnosis and staging are determined by the treating hematology team.</p>" }
          ]
        },
        {
          "title": "Treatment and Prognosis",
          "items": [
            { "q": "How is leukemia treated?", "a": "<p>Leukemia treatment depends on the subtype, the patient's age, and overall health, and may include chemotherapy, targeted therapy, immunotherapy, or a stem cell (bone marrow) transplant. Acute leukemias often need intensive treatment quickly, while some chronic leukemias are managed with oral targeted drugs such as tyrosine kinase inhibitors. Newer options like CAR T-cell therapy may be considered for selected cases. Final treatment decisions should be made by the treating hemato-oncology team.</p>" },
            { "q": "How is lymphoma treated?", "a": "<p>Lymphoma treatment varies widely by subtype and stage and may include chemotherapy, immunotherapy with antibodies such as rituximab, radiation therapy, targeted drugs, or stem cell transplant. Some slow-growing lymphomas may be monitored with active surveillance before treatment begins, while aggressive types usually require prompt combination therapy. CAR T-cell therapy may be considered for certain relapsed or hard-to-treat cases. The most suitable approach depends on specialist review and the treating oncology team.</p>" },
            { "q": "How is myeloma treated?", "a": "<p>Myeloma is generally treated with a combination of drug therapies rather than surgery, since it is spread throughout the bone marrow. Treatment often includes targeted drugs, immunotherapy, chemotherapy, and steroids, sometimes followed by an autologous stem cell transplant using the patient's own cells. Medicines to protect bones and manage kidney or calcium problems may also be used. Myeloma is often treatable but tends to relapse, so long-term specialist follow-up is important.</p>" },

let PAGES = {};                        // { "<cleanSlug>": pageObject }
const loadErrors = [];                 // [{name, reason}]
const dupes = {};                      // slug -> true when a load overwrote an existing page
function addPage(page, sourceName) {
  if (!page || !isFaqShape(page)) { loadErrors.push({ name: sourceName, reason: "not a FAQ fixture" }); return false; }
  const key = cleanSlug(page.slug).value || (getSection(page).h2 || sourceName);
  if (PAGES[key]) dupes[key] = true;
  PAGES[key] = page; return true;
}
function loadBaked() { BAKED.forEach((p, i) => addPage(p, `baked[${i}]`)); }
async function ingestFiles(fileList) {
  const before = loadErrors.length;
  for (const f of fileList) {
    try { addPage(JSON.parse(await f.text()), f.name); }
    catch { loadErrors.push({ name: f.name, reason: "invalid JSON" }); }
  }
  renderAll();
  if (loadErrors.length > before) {
    const skipped = loadErrors.slice(before);
    toast(`Skipped ${skipped.length} file${skipped.length===1?"":"s"}: ` +
      skipped.map(e => `${esc(e.name)} (${e.reason})`).join(", "), true);
  }
}

  switch (FILTER) {
    case "pending": return r.status === "pending";
    case "approved": return r.status === "approved";
    case "needs-work": return r.status === "needs-work";
    case "verify": return pageVerifyFlags(p) > 0;
    default: return true;

}
const FILTER_DEFS = [
  { id: "all", label: "All" },

  { id: "approved", label: "Approved" },
];
function filterCount(id) {
  const keys = Object.keys(PAGES);
  if (id === "all") return keys.length;
  if (id === "verify") return keys.filter(k => pageVerifyFlags(PAGES[k]) > 0).length;
  return keys.filter(k => reviewFor(k).status === id).length;
}
function statusChip(key) {

/* ===== EDITOR — applyEdits overlay (never mutates PAGES) ===== */
function applyEdits(page, key) {
  const r = reviewFor(key), out = JSON.parse(JSON.stringify(page));
  const sec = out.sectionToMerge || out.section;
  (sec.groups || []).forEach((g, gi) => (g.items || []).forEach((it, ii) => {
    const e = r.edits.answers[gi + "." + ii]; if (e != null) it.a = ensureP(e);
  }));
  if (r.edits.slug)  out.slug  = r.edits.slug;   // resolved value replaces the ⚠ VERIFY string
  if (r.edits.route) out.route = r.edits.route;
  return out;
}

/* ===== EXPORT + COPY ===== */
function copyPage() {
  const txt = JSON.stringify(applyEdits(PAGES[SELECTED], SELECTED), null, 2);
  const done = () => toast("Copied corrected JSON to clipboard");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done).catch(() => fallbackCopy(txt, done));
  } else fallbackCopy(txt, done);
}
function fallbackCopy(txt, done) {
  const ta = document.createElement("textarea");
  ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch { toast("Copy failed — clipboard is blocked", true); }
  document.body.removeChild(ta);
}
function buildExport() {
  return Object.keys(PAGES).map(key => {
    const r = reviewFor(key);
    return { slug: key, status: r.status, note: r.note, correctedFixture: applyEdits(PAGES[key], key) };
  });
}
function doExport() {
  if (Object.keys(PAGES).length === 0) { toast("Nothing to export — load some pages first", true); return; }
  const blob = new Blob([JSON.stringify(buildExport(), null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "faq-review-decisions.json";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast("Exported faq-review-decisions.json");
}

  const el = document.getElementById("toast");
  el.innerHTML = warn ? `<span class="warn">⚠</span> ${msg}` : msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 4200);
}

/* ===== BOOT ===== */
function renderAll() {
  if (!PAGES[SELECTED]) SELECTED = Object.keys(PAGES)[0] || null;
  renderSidebar(); renderDetail(); renderProgress();
}
function BOOT() {
  // theme toggle (works with the Artifact viewer's data-theme mechanism)
  document.getElementById("themeBtn").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const isDark = cur ? cur === "dark"
      : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", isDark ? "light" : "dark");
  });

  // file picker
  const fileInput = document.getElementById("fileInput");
  document.getElementById("dropBtn").addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", e => { ingestFiles(e.target.files); fileInput.value = ""; });

  // whole-window drag / drop
  let dragDepth = 0;
  window.addEventListener("dragover", e => { e.preventDefault(); });
  window.addEventListener("dragenter", e => { e.preventDefault(); dragDepth++; document.body.classList.add("dragging"); });
  window.addEventListener("dragleave", e => { e.preventDefault(); if (--dragDepth <= 0) document.body.classList.remove("dragging"); });
  window.addEventListener("drop", e => {
    e.preventDefault(); dragDepth = 0; document.body.classList.remove("dragging");
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) ingestFiles(e.dataTransfer.files);
  });

  document.getElementById("exportBtn").addEventListener("click", doExport);

  const search = document.getElementById("search");
  search.addEventListener("input", () => { QUERY = search.value; renderSidebar(); });

  // boot sequence
  loadReview();
  loadBaked();
  renderAll();
}
BOOT();
</script>
</body>
</html>
